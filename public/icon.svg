<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#primaryGrad)" stroke-width="8" opacity="0.3" filter="url(#glow)" />

  <!-- Stylized Terminal / Codex Symbol -->
  <!-- Prompt Chevron > -->
  <path d="M 140 160 L 220 256 L 140 352" fill="none" stroke="url(#primaryGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cursor / Underline Pulse _ -->
  <line x1="240" y1="352" x2="370" y2="352" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" />

  <!-- Autonomous Sparkle / Antigravity Node -->
  <path d="M 330 180 Q 330 220 370 220 Q 330 220 330 260 Q 330 220 290 220 Q 330 220 330 180 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
  <circle cx="330" cy="220" r="10" fill="#ffffff" />
</svg>
