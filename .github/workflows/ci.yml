# Continuous integration.
#
# Before this existed, the only gate was `npm run lint` run by hand — which
# meant the 188-test suite, the thing that proves the stream, budget, memory and
# WhatsApp paths still work, could be red for days without anyone noticing.
#
# No services, no secrets: the tests run against PGlite (PostgreSQL compiled to
# WASM) in-process and a fake WhatsApp platform, so CI needs nothing but Node.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # `npm ci` is the point: it fails loudly when the lockfile and
      # package.json disagree, which is how a "works on my machine" dependency
      # drift gets caught before a deploy.
      - name: Install
        run: npm ci

      # Server (tsc) and browser app (tsc --checkJs): the latter is what
      # catches a renderer that calls a function nobody declared.
      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build the server bundle
        run: npm run build

      # The bundle must actually run, not merely compile — the path bug this
      # project already hit once (bundled CJS cannot see `import.meta.url`)
      # only appears at runtime.
      - name: Boot the built server
        run: |
          AUTH_MODE=open ENGINE=scripted PORT=3000 node dist/server.cjs &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz > /dev/null; then
              echo "server is up"
              curl -fsS http://127.0.0.1:3000/readyz
              exit 0
            fi
            sleep 1
          done
          echo "server never became ready" >&2
          exit 1

      # Open mode is exactly the config that hides auth bugs, so a second boot
      # proves key mode protects the API: 401 without the key, 200 with it.
      - name: Boot in key mode and prove the auth guard works
        run: |
          AUTH_MODE=key ACCESS_KEY=test-access-key-12345 ENGINE=scripted PORT=3001 node dist/server.cjs &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/healthz > /dev/null; then
              echo "key-mode server is up"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/healthz > /dev/null || { echo "key-mode server never became ready" >&2; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/api/status)
          [ "$code" = "401" ] || { echo "expected 401 without the key, got $code" >&2; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "x-access-key: test-access-key-12345" http://127.0.0.1:3001/api/status)
          [ "$code" = "200" ] || { echo "expected 200 with the key, got $code" >&2; exit 1; }
          echo "key mode: 401 without the key, 200 with it"
