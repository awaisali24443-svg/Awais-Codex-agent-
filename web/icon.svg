<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="WAIS">
  <!--
    The WAIS mark.

    A monogram "W" cut from warm ivory, with a spark rising out of its middle
    vertex: the agent finishing the work it was handed. The badge is a deep
    indigo-charcoal — deliberately not the blue-violet every assistant wears —
    and the spark is the app's own terracotta accent, so the icon and the
    interface are visibly the same product.

    Drawn as strokes and one four-point star, which is why it survives being
    rendered at 16px in a favicon: no detail is thinner than the stroke.
    Ids are unique per file; the inline copies in index.html use their own.
  -->
  <defs>
    <linearGradient id="wais-bg" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#2b2946"/>
      <stop offset=".5" stop-color="#1c1a2c"/>
      <stop offset="1" stop-color="#0f0e16"/>
    </linearGradient>
    <linearGradient id="wais-w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f6f2ea"/>
      <stop offset="1" stop-color="#d6cec0"/>
    </linearGradient>
    <linearGradient id="wais-spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdda6"/>
      <stop offset="1" stop-color="#c2613e"/>
    </linearGradient>
    <radialGradient id="wais-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e07a4e" stop-opacity=".38"/>
      <stop offset="1" stop-color="#e07a4e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#wais-bg)"/>
  <circle cx="70" cy="26" r="46" fill="url(#wais-glow)"/>
  <rect x=".9" y=".9" width="98.2" height="98.2" rx="23.2" fill="none"
        stroke="#ffffff" stroke-opacity=".1" stroke-width="1.8"/>

  <!-- The monogram and its spark, grouped so scripts/make-icons.mjs can scale
       them as one piece for the maskable icon, where Android crops the edges. -->
  <g id="wais-mark">
    <!-- The W: one polyline, round joins, so the monogram stays sharp when small. -->
    <path d="M22.5 43 35.5 74.5 50 52.5 64.5 74.5 77.5 43" fill="none" stroke="url(#wais-w)"
          stroke-width="9.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- The spark: four points, the top one longest, rising from the middle vertex. -->
    <path d="M50 15 52.6 23.9 61.5 26.5 52.6 29.1 50 38 47.4 29.1 38.5 26.5 47.4 23.9Z"
          fill="url(#wais-spark)"/>
  </g>
</svg>
