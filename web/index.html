<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#f5f3ef" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>Codex</title>
<script>
/* Theme before first paint: avoids a light flash for dark-mode users.
   The toggle lives in app.js; this only reads the saved choice. */
try {
  var __pref = localStorage.getItem('codex-theme') || 'system';
  var __dark = __pref === 'dark' ||
    (__pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (__dark) document.documentElement.dataset.theme = 'dark';
} catch (e) { /* private mode: stay light */ }
</script>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<!-- ======================= sign in ======================= -->
<section id="screen-login" class="screen login" hidden>
  <div class="login-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.5c.6 3.6 1.9 5.6 4.6 6.4 1.4.4 2.6.6 4.4.6-3.4.8-5.4 2.2-6.2 4.7-.4 1.3-.6 2.5-.6 4.3-.7-3.3-2-5.2-4.4-6.1-1.4-.5-2.6-.7-4.4-.8 3.4-.7 5.3-2 6.1-4.5.4-1.3.5-2.5.5-4.6Z"/>
        <circle cx="18.5" cy="18" r="2.2" opacity=".55"/>
      </svg>
      <span class="wordmark">codex</span>
    </div>

    <h1 class="login-title">Leave it all to Codex<br />Your own AI agent</h1>

    <form id="login-form" class="login-form" autocomplete="on">
      <label class="field">
        <input id="login-key" type="password" name="key" placeholder="Your access key"
               autocomplete="current-password" spellcheck="false" required />
      </label>
      <button type="submit" class="cta" id="login-submit">Continue</button>
      <p class="login-hint" id="login-hint">Saved on this device. You will not be asked again.</p>
    </form>
  </div>
</section>

<!-- ======================= the app ======================= -->
<section id="screen-app" class="screen app" hidden>
  <header class="topbar">
    <button class="icon-btn" id="btn-menu" aria-label="Open tasks">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="topbar-mid">
      <span class="topbar-title" id="topbar-title">Codex</span>
      <span class="status-dot" id="status-dot" hidden></span>
    </div>
    <button class="icon-btn" id="btn-stop" aria-label="Stop task" hidden>
      <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="icon-btn" id="btn-new" aria-label="New task">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon-btn" id="btn-theme" aria-label="Theme: system">
      <svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
    </button>
  </header>

  <div class="branch-bar" id="branch-bar" hidden></div>

  <main class="stream" id="stream">
    <!-- empty state: welcome screen -->
    <div class="hero" id="hero">
      <div class="brand brand-lg">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.5c.6 3.6 1.9 5.6 4.6 6.4 1.4.4 2.6.6 4.4.6-3.4.8-5.4 2.2-6.2 4.7-.4 1.3-.6 2.5-.6 4.3-.7-3.3-2-5.2-4.4-6.1-1.4-.5-2.6-.7-4.4-.8 3.4-.7 5.3-2 6.1-4.5.4-1.3.5-2.5.5-4.6Z"/>
          <circle cx="18.5" cy="18" r="2.2" opacity=".55"/>
        </svg>
        <span class="wordmark">codex</span>
      </div>
      <h2 class="hero-name">Awais Codex</h2>
      <p class="hero-greet">What should I do for you today?</p>
      <div class="hero-chips" id="chips" role="group" aria-label="Try one of these"></div>
    </div>

    <div class="thread" id="thread"></div>
  </main>

  <div class="composer-wrap">
    <form class="composer" id="composer">
      <textarea id="prompt" rows="1" placeholder="Assign a task or ask anything"
                autocomplete="off" spellcheck="false"></textarea>
      <div class="composer-row">
        <button type="button" class="icon-btn sm" id="btn-attach" aria-label="Attach" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <label class="ping-toggle" id="ping-wrap" hidden title="Ping me on WhatsApp when this finishes">
          <input type="checkbox" id="ping-check">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span>ping</span>
        </label>
        <label class="research-toggle" id="research-wrap" title="Deep research: keep digging until the time budget runs out">
          <input type="checkbox" id="research-check">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>research</span>
          <select id="research-minutes" aria-label="Deep research time budget" hidden>
            <option value="15">15 min</option>
            <option value="60">1 hour</option>
            <option value="custom">custom…</option>
          </select>
          <input id="research-custom" type="number" min="5" max="480" step="1" value="30"
                 aria-label="Custom research budget in minutes" hidden>
        </label>
        <button type="submit" class="send" id="btn-send" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <span class="estimate-line" id="estimate-line" hidden>
          <span id="estimate-text"></span>
          <label class="cap-toggle" title="Stop this task if it passes this many tokens — finished steps are saved">
            cap <input id="token-cap" type="number" min="1" max="200" step="1" placeholder="k" aria-label="Token budget in thousands">
          </label>
        </span>
      </div>
    </form>
    <p class="composer-note" id="composer-note"></p>
  </div>
</section>

<!-- ======================= drawer ======================= -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <span class="drawer-title">Your tasks</span>
    <button class="icon-btn sm" id="btn-close-drawer" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <button class="cta ghost" id="btn-new-2">New task</button>
  <div class="budget" id="budget"></div>
  <section class="memory" id="memory" hidden>
    <button class="memory-head" id="memory-toggle" aria-expanded="false">
      <span class="memory-title" id="memory-title">Remembered</span>
      <svg class="memory-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="memory-body" id="memory-body" hidden></div>
  </section>
  <section class="memory" id="settings" hidden>
    <button class="memory-head" id="settings-toggle" aria-expanded="false">
      <span class="memory-title" id="settings-title">Settings</span>
      <svg class="memory-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="memory-body" id="settings-body" hidden></div>
  </section>
  <section class="memory" id="schedules" hidden>
    <button class="memory-head" id="schedules-toggle" aria-expanded="false">
      <span class="memory-title" id="schedules-title">Scheduled</span>
      <svg class="memory-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="memory-body" id="schedules-body" hidden></div>
  </section>
  <nav class="convos" id="convos"></nav>
  <button class="drawer-foot" id="btn-signout">Sign out</button>
</aside>

<!-- ======================= outputs panel ======================= -->
<div class="panel-backdrop" id="panel-backdrop" hidden></div>
<aside class="panel" id="panel" aria-hidden="true" aria-label="Run outputs">
  <div class="panel-head">
    <span class="panel-title" id="panel-title">Outputs</span>
    <button class="icon-btn sm" id="panel-close" aria-label="Close outputs">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="panel-tabs" id="panel-tabs" role="tablist" aria-label="Output sections"></div>
  <div class="panel-body" id="panel-body"></div>
</aside>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
