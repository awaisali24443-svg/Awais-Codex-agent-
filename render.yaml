services:
  - type: web
    name: awais-codex-agent
    env: node
    plan: free
    # `npm ci` needs the lockfile to be in sync; `--include=dev` is required
    # because the build uses esbuild, which is a devDependency, and Render sets
    # NODE_ENV=production for the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production

      # ---- database (required) ------------------------------------------
      # Neon *pooled* connection string (host contains "-pooler"). Render's
      # free disk is ephemeral, so every run and message lives in Postgres.
      - key: DATABASE_URL
        sync: false

      # ---- secrets (required) -------------------------------------------
      # Signs session cookies. Generated once by Render and never shown to
      # anyone but this service.
      - key: SESSION_SECRET
        generateValue: true
      # The key in your saved link: https://<service>.onrender.com/?k=<ACCESS_KEY>
      # Open that URL once and the browser keeps a signed session for a year.
      - key: ACCESS_KEY
        generateValue: true
      # Encrypts stored API tokens (AES-256-GCM). Must be exactly 64 hex
      # characters, which Render cannot generate — create it with:
      #   openssl rand -hex 32
      # Changing it later makes every stored secret unreadable.
      - key: MASTER_KEY
        sync: false

      # ---- the agent -----------------------------------------------------
      # Google AI Studio key (https://aistudio.google.com/apikey).
      - key: GEMINI_API_KEY
        sync: false
      - key: ENGINE
        value: antigravity
      # The managed agent id is date-stamped and Google retires old ones. If
      # missions start failing with agent_unavailable, this is the value to
      # update — see https://ai.google.dev/gemini-api/docs/antigravity-agent
      - key: ANTIGRAVITY_AGENT
        value: antigravity-preview-09-2026

      # ---- quota & retention --------------------------------------------
      - key: DAILY_RUN_BUDGET
        value: "100"
      - key: EVENT_RETENTION_DAYS
        value: "14"
      - key: ARTIFACT_RETENTION_DAYS
        value: "7"

      # ---- WhatsApp (optional) ------------------------------------------
      # From the phone: Settings -> Agents -> Create an agent -> open its chat
      # -> Chat info -> API key. Leaving this unset simply disables the poller.
      - key: WHATSAPP_TOKEN
        sync: false
      # Exactly ONE process may long-poll an agent; a second poller kills the
      # first with a 409. Set true here OR on your laptop, never both.
      - key: POLLER_ENABLED
        value: "false"
